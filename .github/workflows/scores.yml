name: Scores Facebook

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test sans publier (true/false)"
        default: "false"
        required: false
      test_post:
        description: "Publier un message de test"
        default: "false"
        required: false
  # Backup très léger (le vrai rythme vient de cron-job.org)
  schedule:
    - cron: "12 11,15,19 * * *"

concurrency:
  group: scores
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: scores-state-${{ github.run_id }}
          restore-keys: |
            scores-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer le bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TEST_POST: ${{ github.event.inputs.test_post || 'false' }}
        run: python bot.py

      - name: Save state
        if: always()
        uses: actions/cache@v4
        with:
          path: state.json
          key: scores-state-${{ github.run_id }}
