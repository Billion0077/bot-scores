name: Scores Facebook

on:
  # Filet de sécurité de GitHub (souvent lent). Le vrai rythme viendra de cron-job.org
  schedule:
    - cron: "7,37 10-22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test sans publier (true ou false)"
        default: "true"
      test_post:
        description: "Publier un message de test (true ou false)"
        default: "false"

concurrency:
  group: scores
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer le bot
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TEST_POST: ${{ github.event.inputs.test_post || 'false' }}
        run: python bot.py
        
