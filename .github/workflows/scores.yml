name: Scores Facebook

on:
  schedule:
    # toutes les 15 minutes, de 11h a 22h59 (heure UTC)
    - cron: "*/15 11-22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test sans publier (true ou false)"
        default: "true"
      test_post:
        description: "Publier un message de test (true ou false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: scores
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer le bot
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TEST_POST: ${{ github.event.inputs.test_post || 'false' }}
        run: python bot.py

      - name: Sauvegarder l'état
        if: always()
        run: |
          if [ -f state_v2.json ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add state_v2.json
            git diff --staged --quiet || (git commit -m "maj etat" && git push)
          fi
          
